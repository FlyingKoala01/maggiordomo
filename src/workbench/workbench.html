<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Maggiordomo — Workbench</title>
  <link rel="icon" href="../../icons/icon32.png" />
  <link rel="stylesheet" href="../shared/common.css" />
  <link rel="stylesheet" href="workbench.css" />
  <script src="../../vendor/marked.min.js"></script>
  <script src="../../vendor/purify.min.js"></script>
  <script src="../../vendor/mammoth.browser.min.js" defer></script>
  <script src="../../vendor/xlsx.full.min.js" defer></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">M</span><span>Maggiordomo</span></div>
      <nav id="nav"></nav>
      <div class="sidebar-footer">
        <label class="inline small sidebar-setting" title="When a .docx / .xlsx / .csv download starts, cancel it and open the file in the Word / Excel viewer instead. Asks for the downloads permission once.">
          <input type="checkbox" id="intercept-downloads" /> Open Word/Excel downloads in viewer
        </label>
        <label class="inline small sidebar-setting" title="Skip a download when a file with the same name and exact size is already in your Downloads folder. Shows a notification with Open / Show in folder / Download anyway. Asks for the downloads and notifications permissions once.">
          <input type="checkbox" id="dedupe-downloads" /> Skip duplicate downloads (same name and size)
        </label>
        <button class="btn btn-ghost btn-sm" id="theme-toggle" title="Toggle theme">◐ Theme</button>
        <button class="btn btn-ghost btn-sm" id="export-all" title="Export all data as JSON">⇩ Export</button>
        <button class="btn btn-ghost btn-sm" id="import-all" title="Import data from a JSON export">⇧ Import</button>
      </div>
    </aside>
    <main id="main" class="main"></main>
  </div>
  <script type="module" src="workbench.js"></script>
</body>
</html>
